name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pinned:
    name: pytest (Python ${{ matrix.python-version }}, pinned dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[test]
      - run: python -m pytest -q

  latest:
    name: pytest (newest libraries, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install opencv-python-headless numpy pandas seaborn matplotlib openpyxl scipy statsmodels pytest
      - run: pip install -e . --no-deps
      - run: python -m pytest -q
