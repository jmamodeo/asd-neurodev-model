[project]
name = "asd-neurodev-model"
dynamic = ["version", "dependencies"]
description = "Python neural-network model of how elevated Wnt/mTOR-CCL5 signaling in autism spectrum disorder could slow learning in a visual image-classification network."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Amodeo" }, { name = "Rithvik Marri" }]
keywords = ["neuroscience", "computational-neuroscience", "neural-network", "autism", "wnt", "mtor", "ccl5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Python 3.11 is the version used in the paper; 3.12 also passes the tests with the pinned versions in requirements.txt.
requires-python = ">=3.11,<3.13"

[project.optional-dependencies]
test = ["pytest==8.0.2"]
paper = ["Markdown==3.11.3", "weasyprint==70.0"]  # only to rebuild docs/paper/paper.pdf
lint = ["ruff==0.17.5"]  # ruff check . and ruff format --check . (settings below)

[project.urls]
Repository = "https://github.com/jmamodeo/asd-neurodev-model"

# No console scripts on purpose: `python main.py` trains one network and `python reproduce.py` re-creates the paper's figures.
# The data, figures, tables and paper live in the repository, so install it editable: pip install -e .[test]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "asd_model.__version__" }  # CITATION.cff and the git tag must match (tests/test_metadata.py)
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.format]
# John's hand-written modules keep his layout (aligned continuation lines, teaching comments); `ruff format` skips them
exclude = [
    "src/asd_model/main.py",
    "src/asd_model/neural_network.py",
    "src/asd_model/network_tuning.py",
    "src/asd_model/visual_input.py",
    "src/asd_model/loss_outputs.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "SIM", "UP", "D"]
# Keeps the original "This function ..." docstring voice; B905 (zip strict=) is checked by hand where lengths could differ.
ignore = ["D203", "D213", "D404", "D401", "SIM108", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "N806"]
"scripts/*" = ["D103"]
