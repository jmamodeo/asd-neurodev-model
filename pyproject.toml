[project]
name = "asd-neurodev-model"
dynamic = ["version"]
description = "Python neural-network model of how elevated Wnt/mTOR-CCL5 signaling in autism spectrum disorder could slow learning in a visual image-classification network."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Amodeo" }, { name = "Rithvik Marri" }]
keywords = ["neuroscience", "computational-neuroscience", "neural-network", "autism", "wnt", "mtor", "ccl5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Python 3.11 is the version used in the paper; 3.12 also passes the tests with these pinned versions.
requires-python = ">=3.11,<3.13"
# Pinned to the versions verified to run the model and reproduce.py (this file is the single source for the pins).
dependencies = [
    "opencv-python==4.8.1.78",
    "numpy==1.26.4",
    "pandas==2.1.4",
    "seaborn==0.12.2",
    "matplotlib==3.8.2",
    "openpyxl==3.1.2",
    "scipy==1.11.4",
    "statsmodels==0.14.1",
]

[project.optional-dependencies]
test = ["pytest==8.0.2"]
paper = ["Markdown==3.11.3", "weasyprint==70.0"]  # only to rebuild docs/paper/paper.pdf

[project.urls]
Repository = "https://github.com/jmamodeo/asd-neurodev-model"

# `python -m asd_model` trains one network, `asd-reproduce` (or `python reproduce.py`) re-creates the paper's figures and tables.
# The data, figures, tables and paper live in the repository, so install it editable: pip install -e .
[project.scripts]
asd-model = "asd_model.__main__:main"
asd-reproduce = "asd_model.reproduce:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "asd_model.__version__" }  # CITATION.cff and the git tag must match (tests/test_metadata.py)

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "SIM", "UP", "D"]
# Keeps the original "This function ..." docstring voice; B905 (zip strict=) is checked by hand where lengths could differ.
ignore = ["D203", "D213", "D404", "D401", "SIM108", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "N806"]
"scripts/*" = ["D103"]
